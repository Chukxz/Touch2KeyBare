[build-system]
requires = ["setuptools>=61.0", "wheel>=0.36.0"]
build-backend = "setuptools.build_meta"

[project]
authors = [
  {name = "Chukwuemeka", email = "chukwuemekaigwe05@gmail.com"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
    "keyboard>=0.13.5",
    "matplotlib>=3.10.8",
    "pillow>=12.1.0",
    "psutil>=7.2.1",
    "PyQt5>=5.15.11",
    "requests>=2.34.2",
    "tomlkit>=0.14.0",

    "pywin32>=311 ; sys_platform == 'win32'",
    "interception-python>=1.13.6 ; sys_platform == 'win32'",

    "python-xlib>=0.31 ; sys_platform == 'linux'",
    "python-evdev>=0.11.0 ; sys_platform == 'linux'"
]
description = "A high-performance touch-to-keyboard/mouse mapper for PC gaming."
name = "Touch2Key"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.urls]
Homepage = "https://github.com/Chukxz/Touch2Key"

[project.scripts]
capture = "mapper_module.scripts.adb_screen_capture:run"
plot = "mapper_module.scripts.plotting:run"
reset = "mapper_module.scripts.hard_reset_toml:run"
select = "mapper_module.scripts.select_json:run"
setup = "mapper_module.scripts.setup:run"
show = "mapper_module.scripts.show:run"
touch2key = "mapper_module.__main__:run"
wireless = "mapper_module.scripts.force_wireless:run" 

[tool.setuptools.packages.find]
where = ["src"]
